# Agent Layer v2 - Render Deployment
# MCP-native Alberta business directory for AI agents
# 
# NOTE: Set SUPABASE_SERVICE_KEY in Render Dashboard Environment Variables
# DO NOT commit sensitive keys to git

services:
  - type: web
    name: agent-layer
    runtime: node
    region: oregon
    plan: free
    # Build commands
    buildCommand: npm install && npm run build
    startCommand: node dist/server-v2.js
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      # Supabase configuration (set in Render Dashboard)
      - key: SUPABASE_URL
        value: https://lalpxtoxziyjibifibsx.supabase.co
      # SUPABASE_SERVICE_KEY - Set in Render Dashboard > Environment
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: '*'
      - key: RATE_LIMIT
        value: '100'
    
    # Health check endpoint
    healthCheckPath: /health
